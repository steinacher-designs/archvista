name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: TypeScript + unit / integration tests (DXF import, analysis, walking, zones, website, publishing)
        run: npm run build:runtime && npx tsc --noEmit -p . && npm test
      - name: Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
          cd src-tauri && cargo test
      - name: Performance benchmark
        run: npx tsx scripts/benchmark.ts > benchmark.md && cat benchmark.md >> $GITHUB_STEP_SUMMARY

  windows:
    name: Windows installer (test build)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build -c '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.ARCHVISTA_OAUTH_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ARCHVISTA-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
