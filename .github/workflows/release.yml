name: Release
# Creates a GitHub Release (draft) with the Windows setup (.exe) and MSI.
# Start it manually ("Run workflow") or by pushing a version tag; the tag v<version> is taken from tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - name: Check signing key
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – ohne ihn funktionieren automatische Updates nicht."; exit 1; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.ARCHVISTA_OAUTH_CLIENT_ID }}
          # signs the update package so installed apps accept it (see docs/ENTWICKLUNG.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "ARCHVISTA v__VERSION__"
          releaseBody: |
            ## ARCHVISTA herunterladen
            - **ARCHVISTA_…_x64-setup.exe** – empfohlen: Doppelklick, installieren, fertig.
            - **ARCHVISTA_…_x64_de-DE.msi** – für IT-Abteilungen / zentrale Verteilung.

            Keine weiteren Programme nötig (kein AutoCAD, Blender oder Python). Windows 10/11, 64 Bit.
          releaseDraft: false
          includeUpdaterJson: true
      - name: Stable download link (…/releases/latest/download/ARCHVISTA-Setup.exe)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$EXE" ARCHVISTA-Setup.exe
          gh release upload "v$VERSION" ARCHVISTA-Setup.exe --clobber
          prerelease: false
