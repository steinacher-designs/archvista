[package]
name = "archvista"
version = "1.6.0"
description = "ARCHVISTA – 3D-DXF zu interaktiver Architektur-Website"
authors = ["Judith Steinacher"]
license = "MIT"
edition = "2021"

[lib]
name = "archvista_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["rustls-tls-native-roots"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
